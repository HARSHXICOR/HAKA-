name: Haka backend CI

on:
  pull_request:
    paths:
      - "functions/**"
      - "database.rules.json"
      - "firebase.json"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "database.rules.json"
      - "firebase.json"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: functions
      - run: npm run verify:node
        working-directory: functions
      - run: npm test
        working-directory: functions
      - run: npm run build
        working-directory: functions
      - name: Emulator integration and Security Rules
        run: >-
          ./functions/node_modules/.bin/firebase emulators:exec
          --project demo-haka
          --only auth,functions,database
          "cd functions && npm run test:emulator"
        env:
          CI: true
